<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.R.I.S. - Escritorio de Autor</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c2c2c;
            --accent-color: #8c6d46;
            --sidebar-bg: #f4eee1;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #e0d6c3;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            height: 60vh;
            border: 1px solid #e0d6c3;
            background: transparent;
            padding: 20px;
            font-size: 18px;
            line-height: 1.8;
            font-family: inherit;
            color: inherit;
            resize: none;
            border-radius: 8px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .controls-bar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        /* --- MODO ZEN / ENFOQUE TOTAL --- */
        body.zen-mode aside,
        body.zen-mode .controls-bar h2 {
            display: none !important;
        }

        body.zen-mode main {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px;
        }

        .zen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .status-backup {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <button class="zen-btn" onclick="toggleZenMode()">🧘 Modo Zen</button>

    <aside>
        <h2>I.R.I.S. Autor</h2>
        <div>
            <h3>Meta Diaria</h3>
            <p>Objetivo: 500 palabras</p>
            <progress id="progress" value="0" max="500" style="width:100%"></progress>
        </div>
        <div>
            <h3>Capítulos</h3>
            <ul>
                <li>Capítulo 1 (Activo)</li>
            </ul>
        </div>
        <div class="status-backup" id="backupStatus">Respaldo local: Al día</div>
    </aside>

    <main>
        <div class="controls-bar">
            <h2>Editando: Capítulo 1</h2>
        </div>
        <textarea id="editor" placeholder="Comienza a escribir tu historia aquí..." oninput="updateEditor()"></textarea>
        <div>
            <span id="wordCount">0</span> palabras totales
        </div>
    </main>

    <script>
        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('wordCount');
        const progressBar = document.getElementById('progress');
        const backupStatus = document.getElementById('backupStatus');

        // Cargar texto guardado previamente si existe
        if (localStorage.getItem('iris_current_text')) {
            editor.value = localStorage.getItem('iris_current_text');
            updateEditor();
        }

        function updateEditor() {
            const text = editor.value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            wordCount.textContent = words;
            progressBar.value = words;

            // Guardado automático en tiempo real
            localStorage.setItem('iris_current_text', text);
        }

        // Sistema de respaldo local automático por seguridad (Snapshot cada 2 minutos)
        setInterval(() => {
            const text = editor.value;
            const timestamp = new Date().toLocaleTimeString();
            localStorage.setItem(`iris_snapshot_${Date.now()}`, text);
            backupStatus.textContent = `Respaldo local guardado a las ${timestamp}`;
        }, 120000);

        // Alternar Modo Zen
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            const btn = document.querySelector('.zen-btn');
            btn.textContent = document.body.classList.contains('zen-mode') ? '✖ Salir de Zen' : '🧘 Modo Zen';
        }
    </script>
</body>
</html>

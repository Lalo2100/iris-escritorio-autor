<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I.R.I.S. — Escritorio de Autor PRO</title>
<style>
:root {
  --navy: #17263f;
  --navy2: #223752;
  --paper: #f7f3eb;
  --white: #fffefa;
  --teal: #278c83;
  --teal-dark: #1d7069;
  --coral: #d98270;
  --gold: #c5a15d;
  --ink: #253247;
  --muted: #788293;
  --line: #e7e2d8;
  --pale: #e8f3f0;
  --shadow: 0 12px 35px rgba(27,42,63,.07);
  --card-bg: #fffefa;
}

body.dark-theme {
  --navy: #0d1726;
  --navy2: #152238;
  --paper: #121926;
  --white: #1a2332;
  --teal: #33a397;
  --teal-dark: #247c73;
  --coral: #e09383;
  --gold: #d4b270;
  --ink: #e6edf5;
  --muted: #8e9bb0;
  --line: #2a364a;
  --pale: #1c2b3d;
  --shadow: 0 12px 35px rgba(0,0,0,.4);
  --card-bg: #1a2332;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;transition:background .3s, color .3s}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh;display:grid;grid-template-columns:255px minmax(0,1fr);transition:.3s}
.app.focus-mode{grid-template-columns:0 minmax(0,1fr)}
.app.focus-mode .sidebar{display:none}

.sidebar{background:var(--navy);color:#f8f7f1;padding:25px 17px;display:flex;flex-direction:column;gap:28px;min-height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#3ba89d,#226b70);display:grid;place-items:center;color:white;font-family:Georgia,serif;font-size:24px;box-shadow:0 5px 15px #0d182b55}
.brandname{font-family:Georgia,serif;font-size:21px;letter-spacing:1.5px}
.brandtag{font-size:10px;color:#c5d0dc;letter-spacing:.7px;margin-top:3px}

.nav-label{color:#91a1b6;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:0 13px;margin-bottom:8px}
.nav{display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#d9e0e9;padding:12px 13px;border-radius:12px;text-align:left;transition:.18s}
.nav button:hover{background:#ffffff0d}
.nav button.active{background:#ffffff17;color:#fff;box-shadow:inset 3px 0 var(--coral)}
.nav .ico{width:21px;text-align:center;font-size:17px}

.sidebar-bottom{margin-top:auto}
.tip{background:#ffffff0d;border:1px solid #ffffff12;border-radius:16px;padding:15px;color:#dce4ec;line-height:1.5}
.tip strong{display:block;color:#fff;margin:7px 0 4px}
.tip p{font-size:12px;color:#b9c6d5;margin:0}

.main{min-width:0;padding:30px clamp(18px,3vw,42px) 45px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal);font-weight:800}
.topbar h1{font-size:clamp(25px,3vw,34px);font-weight:650;letter-spacing:-1px;margin:7px 0 5px;color:var(--ink)}
.subtitle{color:var(--muted);font-size:14px}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--card-bg);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,.1)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:white}
.btn.small{padding:7px 10px;font-size:12px}
.btn.danger{background:#e53e3e;border-color:#e53e3e;color:white}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
.content{min-width:0}
.panel{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.panel h2{font-size:16px;margin:0;color:var(--ink)}
.panel h3{margin:0;color:var(--ink)}
.muted{color:var(--muted)}
.tiny{font-size:12px}

.book-hero{position:relative;overflow:hidden;background:var(--pale);display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:20px;align-items:center}
.book-title{width:100%;border:0;background:transparent;font-family:Georgia,serif;font-size:clamp(23px,3vw,31px);color:var(--ink);outline:none;padding:2px 0}
.book-title:focus{border-bottom:1px solid var(--teal)}
.field-label{font-size:11px;color:var(--muted);font-weight:750;display:block;margin:13px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--card-bg);border-radius:9px;padding:10px 11px;color:var(--ink);outline:none

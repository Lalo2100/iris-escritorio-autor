<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I.R.I.S. - Escritorio de Autor Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; display: flex; height: 100vh; background-color: #fdfbf7; color: #2c2c2c; }
    
    /* Barra Lateral */
    .sidebar { width: 300px; background-color: #f4efe6; border-right: 1px solid #e0d8c8; display: flex; flex-direction: column; padding: 20px; }
    .sidebar h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #5a5245; margin-bottom: 15px; border-bottom: 1px solid #dcd4c5; padding-bottom: 8px; }
    
    .btn-nuevo { background-color: #8c6d46; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; width: 100%; font-family: inherit; }
    .btn-nuevo:hover { background-color: #735735; }
    
    .lista-capitulos { list-style: none; overflow-y: auto; flex-grow: 1; }
    .item-capitulo { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; background-color: #eadecc; transition: all 0.2s; }
    .item-capitulo:hover { background-color: #dfcfb9; }
    .item-capitulo.activo { background-color: #8c6d46; color: white; }
    .titulo-cap { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
    
    .acciones-cap { display: flex; gap: 4px; }
    .btn-accion { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 2px 4px; border-radius: 4px; }
    .btn-accion:hover { background-color: rgba(0,0,0,0.1); }
    .item-capitulo.activo .btn-accion { color: white; }
    
    /* Área Principal de Escritura */
    .main-content { flex-grow: 1; display: flex; flex-direction: column; padding: 30px; overflow-y: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .input-titulo { font-size: 1.8rem; font-weight: bold; border: none; background: transparent; outline: none; width: 100%; margin-bottom: 15px; font-family: inherit; color: #1a1a1a; }
    
    .editor-container { flex-grow: 1; display: flex; flex-direction: column; }
    textarea { width: 100%; height: 100%; min-height: 400px; border: 1px solid #e0d8c8; border-radius: 8px; padding: 20px; font-size: 1.1rem; line-height: 1.6; font-family: 'Georgia', serif; background-color: #ffffff; resize: none; outline: none; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
    
    .footer-stats { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.85rem; color: #7a7265; font-family: sans-serif; }
    .btn-herramienta { background-color: #e0d8c8; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .btn-herramienta:hover { background-color: #d0c4b0; }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <div class="sidebar">
    <h2>📖 Capítulos</h2>
    <button class="btn-nuevo" onclick="crearCapitulo()">+ Nuevo Capítulo</button>
    <ul class="lista-capitulos" id="listaCapitulos"></ul>
  </div>

  <!-- ÁREA DE ESCRITURA -->
  <div class="main-content">
    <div class="top-bar">
      <div><strong>I.R.I.S.</strong> Escritorio de Autor</div>
      <div>
        <button class="btn-herramienta" onclick="exportarTexto()">📥 Exportar (.txt)</button>
      </div>
    </div>

    <input type="text" id="tituloCapitulo" class="input-titulo" placeholder="Título del Capítulo..." oninput="actualizarCapituloActual()">
    
    <div class="editor-container">
      <textarea id="contenidoCapitulo" placeholder="Empieza a escribir aquí tu historia..." oninput="actualizarCapituloActual()"></textarea>
    </div>

    <div class="footer-stats">
      <span id="contadorTexto">Palabras: 0 | Caracteres: 0</span>
      <span>Guardado automático activo</span>
    </div>
  </div>

  <script>
    // Estado inicial de datos
    let capitulos = JSON.parse(localStorage.getItem('iris_capitulos')) || [
      { titulo: "Capítulo 1: El Comienzo", contenido: "Escribe aquí el contenido de tu primer capítulo..." }
    ];
    let indiceActivo = 0;

    // Inicializar aplicación
    function iniciarApp() {
      if (capitulos.length === 0) {
        capitulos.push({ titulo: "Nuevo Capítulo", contenido: "" });
      }
      renderizarLista();
      cargarCapitulo(0);
    }

    // Renderizar la lista de capítulos en la barra lateral
    function renderizarLista() {
      const lista = document.getElementById('listaCapitulos');
      lista.innerHTML = '';

      capitulos.forEach((cap, index) => {
        const li = document.createElement('li');
        li.className = `item-capitulo ${index === indiceActivo ? 'activo' : ''}`;
        
        // Al hacer clic en cualquier parte del ítem, te cambia a ese capítulo
        li.onclick = () => cargarCapitulo(index);

        li.innerHTML = `
          <span class="titulo-cap">${cap.titulo || 'Sin título'}</span>
          <div class="acciones-cap">
            <button class="btn-accion" title="Renombrar" onclick="renombrarCapitulo(event, ${index})">✏️</button>
            <button class="btn-accion" title="Eliminar" onclick="eliminarCapitulo(event, ${index})">🗑️</button>
          </div>
        `;
        lista.appendChild(li);
      });
    }

    // Cargar capítulo seleccionado
    function cargarCapitulo(index) {
      if (index < 0 || index >= capitulos.length) return;
      indiceActivo = index;
      
      document.getElementById('tituloCapitulo').value = capitulos[index].titulo;
      document.getElementById('contenidoCapitulo').value = capitulos[index].contenido;
      
      renderizarLista();
      actualizarEstadisticas();
    }

    // Actualizar capítulo mientras se escribe
    function actualizarCapituloActual() {
      const tituloInput = document.getElementById('tituloCapitulo').value;
      const contenidoInput = document.getElementById('contenidoCapitulo').value;

      capitulos[indiceActivo].titulo = tituloInput;
      capitulos[indiceActivo].contenido = contenidoInput;

      guardarCambios();
      renderizarLista();
      actualizarEstadisticas();
    }

    // Crear un nuevo capítulo
    function crearCapitulo() {
      const nuevoNum = capitulos.length + 1;
      const nuevo = { titulo: `Capítulo ${nuevoNum}`, contenido: "" };
      capitulos.push(nuevo);
      guardarCambios();
      cargarCapitulo(capitulos.length - 1);
    }

    // Renombrar capítulo
    function renombrarCapitulo(e, index) {
      e.stopPropagation(); // Evita interferir con el clic de selección
      const nuevoNombre = prompt("Ingresa el nuevo nombre para este capítulo:", capitulos[index].titulo);
      if (nuevoNombre !== null && nuevoNombre.trim() !== "") {
        capitulos[index].titulo = nuevoNombre.trim();
        guardarCambios();
        if (index === indiceActivo) {
          document.getElementById('tituloCapitulo').value = capitulos[index].titulo;
        }
        renderizarLista();
      }
    }

    // Eliminar capítulo
    function eliminarCapitulo(e, index) {
      e.stopPropagation(); // Evita interferir con el clic de selección
      if (capitulos.length <= 1) {
        alert("Debes mantener al menos un capítulo en tu proyecto.");
        return;
      }

      if (confirm(`¿Estás seguro de que deseas borrar "${capitulos[index].titulo}"?`)) {
        capitulos.splice(index, 1);
        if (indiceActivo >= capitulos.length) {
          indiceActivo = capitulos.length - 1;
        }
        guardarCambios();
        cargarCapitulo(indiceActivo);
      }
    }

    // Guardar en localStorage
    function guardarCambios() {
      localStorage.setItem('iris_capitulos', JSON.stringify(capitulos));
    }

    // Estadísticas de palabras y caracteres
    function actualizarEstadisticas() {
      const texto = document.getElementById('contenidoCapitulo').value;
      const palabras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
      const caracteres = texto.length;
      document.getElementById('contadorTexto').innerText = `Palabras: ${palabras} | Caracteres: ${caracteres}`;
    }

    // Exportar archivo .txt
    function exportarTexto() {
      let textoCompleto = "";
      capitulos.forEach(cap => {
        textoCompleto += `=== ${cap.titulo} ===\n\n${cap.contenido}\n\n\n`;
      });

      const blob = new Blob([textoCompleto], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Proyecto_IRIS.txt`;
      a.click();
    }

    // Iniciar al cargar
    iniciarApp();
  </script>
</body>
</html>

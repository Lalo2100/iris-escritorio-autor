<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I.R.I.S. — Escritorio de Autor PRO ULTIMATE</title>
<!-- Librería para exportar a Word (.docx) -->
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<style>
:root {
  --navy: #1f2038; --navy2: #2a2c4e; --paper: #fcf9f2; --white: #ffffff;
  --teal: #6b46c1; --teal-dark: #553c9a; --coral: #d97706; --gold: #b7791f;
  --ink: #2d3748; --muted: #718096; --line: #e2e8f0; --pale: #f3f0ff;
  --shadow: 0 12px 35px rgba(45,55,72,.07); --card-bg: #ffffff;
}

body.dark-theme {
  --navy: #0f1017; --navy2: #181a26; --paper: #12141c; --white: #1a1d2d;
  --teal: #9f7aea; --teal-dark: #805ad5; --coral: #f6ad55; --gold: #d69e2e;
  --ink: #e2e8f0; --muted: #a0aec0; --line: #2d3748; --pale: #1a192b;
  --shadow: 0 12px 35px rgba(0,0,0,.5); --card-bg: #1a1d2d;
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;transition:background .3s, color .3s}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh;display:grid;grid-template-columns:255px minmax(0,1fr);transition:.3s}
.app.focus-mode{grid-template-columns:0 minmax(0,1fr)}
.app.focus-mode .sidebar{display:none}

.sidebar{background:var(--navy);color:#f8f7f1;padding:25px 17px;display:flex;flex-direction:column;gap:28px;min-height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo-icon{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#805ad5,#d69e2e);display:grid;place-items:center;color:white;font-family:Georgia,serif;font-size:22px;font-weight:bold;box-shadow:0 6px 18px rgba(128,90,213,.3)}
.brandname{font-family:Georgia,serif;font-size:21px;letter-spacing:1.5px;color:#fff}
.brandtag{font-size:9px;color:#d6bcfa;letter-spacing:1px;margin-top:3px;text-transform:uppercase}

.nav-label{color:#a0aec0;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:0 13px;margin-bottom:8px}
.nav{display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#e2e8f0;padding:12px 13px;border-radius:12px;text-align:left;transition:.18s}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 var(--gold)}
.nav .ico{width:21px;text-align:center;font-size:17px}

.sidebar-bottom{margin-top:auto}
.tip{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:15px;color:#e2e8f0;line-height:1.5}
.tip strong{display:block;color:#fff;margin:7px 0 4px}
.tip p{font-size:12px;color:#cbd5e0;margin:0}

.main{min-width:0;padding:30px clamp(18px,3vw,42px) 45px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal);font-weight:800}
.topbar h1{font-size:clamp(25px,3vw,34px);font-weight:650;letter-spacing:-1px;margin:7px 0 5px;color:var(--ink)}
.subtitle{color:var(--muted);font-size:14px}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--card-bg);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(0,0,0,.08)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:white}
.btn.small{padding:7px 10px;font-size:12px}
.btn.danger{background:#e53e3e;border-color:#e53e3e;color:white}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}
.content{min-width:0}
.panel{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.panel h2{font-size:16px;margin:0;color:var(--ink)}
.panel h3{margin:0;color:var(--ink)}
.muted{color:var(--muted)}
.tiny{font-size:12px}

.book-hero{position:relative;overflow:hidden;background:var(--pale);display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:20px;align-items:center}
.book-title{width:100%;border:0;background:transparent;font-family:Georgia,serif;font-size:clamp(23px,3vw,31px);color:var(--ink);outline:none;padding:2px 0}
.book-title:focus{border-bottom:1px solid var(--teal)}
.field-label{font-size:11px;color:var(--muted);font-weight:750;display:block;margin:13px 0 6px}
.field{width:100%;border:1px solid var(--line);background:var(--card-bg);border-radius:9px;padding:10px 11px;color:var(--ink);outline:none}
.field:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(107,70,193,.15)}
.book-desc{resize:vertical;min-height:52px;max-height:140px;line-height:1.5}

.hero-stat{z-index:1;text-align:center;background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:18px 12px}
.stat-number{font-size:30px;font-weight:750;color:var(--teal);letter-spacing:-1px}
.stat-caption{font-size:11px;color:var(--muted);margin-top:4px}

.chapter-list{display:grid;gap:8px}
.chapter-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card-bg);transition:.15s}
.chapter-row.selected{border-color:var(--teal);background:var(--pale)}
.chapter-pick{display:flex;align-items:center;gap:11px;min-width:0;flex:1;background:transparent;border:0;text-align:left;color:var(--ink)}
.chapter-number{flex:0 0 34px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--pale);color:var(--muted);font-weight:750}
.selected .chapter-number{background:var(--teal);color:white}
.chapter-text{min-width:0}
.chapter-name{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:7px}
.icon-btn:hover{background:var(--pale);color:var(--ink)}

.editor-panel{padding:0;overflow:hidden}
.editor-top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted)}
.crumb strong{color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.editor-body{padding:clamp(20px,4vw,44px);min-height:420px}
.chapter-title-input{display:block;width:100%;border:0;background:transparent;font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,3vw,34px);font-weight:600;color:var(--ink);outline:none;margin-bottom:22px}
.writing-area{display:block;width:100%;min-height:315px;border:0;outline:none;resize:vertical;background:transparent;color:var(--ink);font-family:Georgia,"Times

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.R.I.S. - Escritorio de Autor</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --text-color: #2c2c2c;
            --accent-color: #8c6d46;
            --sidebar-bg: #f4eee1;
            --border-color: #e0d6c3;
            --panel-bg: #ffffff;
            --font-family: 'Georgia', serif;
        }

        /* Temas de Color */
        body.theme-oled {
            --bg-color: #000000;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --sidebar-bg: #121212;
            --border-color: #2a2a2a;
            --panel-bg: #1a1a1a;
        }

        body.theme-sepia {
            --bg-color: #f4ebd9;
            --text-color: #433422;
            --accent-color: #a0522d;
            --sidebar-bg: #e8dcc4;
            --border-color: #d3c2a3;
            --panel-bg: #fbf5e8;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral */
        aside {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .brand-title {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent-color);
            font-weight: bold;
        }

        .panel-box {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .panel-box h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Lista de Capítulos y Personajes */
        ul.item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        ul.item-list li {
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        ul.item-list li:hover, ul.item-list li.active {
            background-color: var(--sidebar-bg);
            font-weight: bold;
        }

        /* Pomodoro */
        .pomodoro-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .timer-display {
            font-size: 1.4rem;
            font-weight: bold;
            font-family: monospace;
        }

        /* Contenido Principal */
        main {
            flex: 1;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        header.top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button, input[type="text"] {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Editor de Texto */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea#editor {
            width: 100%;
            height: 100%;
            min-height: 55vh;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            padding: 25px;
            font-size: 1.1rem;
            line-height: 1.8;
            font-family: var(--font-family);
            color: var(--text-color);
            resize: none;
            border-radius: 8px;
            outline: none;
        }

        textarea#editor:focus {
            border-color: var(--accent-color);
        }

        /* Barra de Estado Inferior */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* --- MODO ZEN / ENFOQUE TOTAL --- */
        body.zen-mode aside,
        body.zen-mode header.top-bar,
        body.zen-mode .status-bar {
            display: none !important;
        }

        body.zen-mode main {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 20px;
            width: 100%;
        }

        .zen-toggle-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 9999;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <button class="zen-toggle-btn" onclick="toggleZenMode()">🧘 Modo Zen</button>

    <!-- Barra Lateral: Organización y Herramientas -->
    <aside>
        <h1 class="brand-title">I.R.I.S.</h1>

        <!-- Selector de Apariencia -->
        <div class="panel-box">
            <h3>🎨 Personalización</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label for="themeSelect">Tema:</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="default">Clásico (Pergamino)</option>
                    <option value="sepia">Sepia Cálido</option>
                    <option value="oled">Noche OLED</option>
                </select>

                <label for="fontSelect">Tipografía:</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="'Georgia', serif">Georgia</option>
                    <option value="'Garamond', serif">Garamond</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Arial', sans-serif">Arial</option>
                </select>
            </div>
        </div>

        <!-- Meta Diaria -->
        <div class="panel-box">
            <h3>📊 Meta Diaria</h3>
            <p>Objetivo: <span id="goalTarget">500</span> palabras</p>
            <progress id="progressBar" value="0" max="500" style="width: 100%; height: 12px;"></progress>
        </div>

        <!-- Temporizador Pomodoro -->
        <div class="panel-box">
            <h3>⏱️ Pomodoro</h3>
            <div class="pomodoro-controls">
                <span class="timer-display" id="timerDisplay">25:00</span>
                <button onclick="toggleTimer()" id="timerBtn">Iniciar</button>
                <button onclick="resetTimer()">↺</button>
            </div>
        </div>

        <!-- Estructura de Capítulos -->
        <div class="panel-box">
            <h3>📖 Capítulos</h3>
            <ul class="item-list" id="chapterList">
                <li class="active">Capítulo 1: Inicio</li>
            </ul>
            <input type="text" id="newChapterInput" placeholder="Nuevo capítulo..." style="width: 100%; margin-top: 8px;">
            <button onclick="addChapter()" class="primary-btn" style="width: 100%; margin-top: 5px;">+ Agregar</button>
        </div>

        <!-- Fichas de Personajes -->
        <div class="panel-box">
            <h3>👤 Personajes</h3>
            <ul class="item-list" id="characterList">
                <li>Protagonista</li>
            </ul>
            <input type="text" id="newCharInput" placeholder="Nuevo personaje..." style="width: 100%; margin-top: 8px;">
            <button onclick="addCharacter()" class="primary-btn" style="width: 100%; margin-top: 5px;">+ Agregar</button>
        </div>

        <div style="font-size: 0.75rem; opacity: 0.7; text-align: center;" id="backupStatus">
            Respaldo local: Activo
        </div>
    </aside>

    <!-- Área Principal de Escritura -->
    <main>
        <header class="top-bar">
            <h2 id="currentChapterTitle" style="margin: 0;">Capítulo 1: Inicio</h2>
            <div class="controls-group">
                <button onclick="exportText()">📥 Exportar (.txt)</button>
            </div>
        </header>

        <div class="editor-container">
            <textarea id="editor" placeholder="Empieza a escribir tu obra aquí..." oninput="onEditorInput()"></textarea>
        </div>

        <footer class="status-bar">
            <div>Palabras: <strong id="wordCount">0</strong> | Caracteres: <span id="charCount">0</span></div>
            <div id="saveIndicator">Guardado en tiempo real</div>
        </footer>
    </main>

    <script>
        // Elementos DOM
        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('wordCount');
        const charCount = document.getElementById('charCount');
        const progressBar = document.getElementById('progressBar');
        const backupStatus = document.getElementById('backupStatus');
        const saveIndicator = document.getElementById('saveIndicator');

        // Inicialización y Carga Local
        window.addEventListener('DOMContentLoaded', () => {
            const savedText = localStorage.getItem('iris_main_content');
            if (savedText) {
                editor.value = savedText;
                onEditorInput();
            }
        });

        // Evento de Escritura y Conteo
        function onEditorInput() {
            const text = editor.value;
            const trimmed = text.trim();
            const words = trimmed === '' ? 0 : trimmed.split(/\s+/).length;
            
            wordCount.textContent = words;
            charCount.textContent = text.length;
            progressBar.value = words;

            // Guardado automático inmediato en LocalStorage
            localStorage.setItem('iris_main_content', text);
            saveIndicator.textContent = "Guardado localmente";
        }

        // Sistema de Respaldo Local Automático (Snapshot cada 2 minutos)
        setInterval(() => {
            const text = editor.value;
            if (text.trim() !== "") {
                const timestamp = new Date().toLocaleTimeString();
                localStorage.setItem(`iris_snapshot_${Date.now()}`, text);
                backupStatus.textContent = `Último respaldo: ${timestamp}`;
            }
        }, 120000);

        // Modo Zen / Enfoque Total
        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            const btn = document.querySelector('.zen-toggle-btn');
            btn.textContent = document.body.classList.contains('zen-mode') ? '✖ Salir de Zen' : '🧘 Modo Zen';
        }

        // Personalización: Temas y Tipografías
        function changeTheme(theme) {
            document.body.className = '';
            if (theme !== 'default') {
                document.body.classList.add(`theme-${theme}`);
            }
        }

        function changeFont(font) {
            document.documentElement.style.setProperty('--font-family', font);
        }

        // Temporizador Pomodoro
        let timerInterval = null;
        let timeLeft = 25 * 60;

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.textContent = "Iniciar";
            } else {
                btn.textContent = "Pausa";
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        alert("¡Tiempo cumplido! Tómate un descanso.");
                        btn.textContent = "Iniciar";
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timeLeft = 25 * 60;
            updateTimerDisplay();
            document.getElementById('timerBtn').textContent = "Iniciar";
        }

        // Capítulos y Personajes
        function addChapter() {
            const input = document.getElementById('newChapterInput');
            if (input.value.trim() !== "") {
                const li = document.createElement('li');
                li.textContent = input.value.trim();
                li.onclick = function() {
                    document.querySelectorAll('#chapterList li').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('currentChapterTitle').textContent = this.textContent;
                };
                document.getElementById('chapterList').appendChild(li);
                input.value = "";
            }
        }

        function addCharacter() {
            const input = document.getElementById('newCharInput');
            if (input.value.trim() !== "") {
                const li = document.createElement('li');
                li.textContent = input.value.trim();
                document.getElementById('characterList').appendChild(li);
                input.value = "";
            }
        }

        // Exportar Documento
        function exportText() {
            const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${document.getElementById('currentChapterTitle').textContent}.txt`;
            link.click();
        }
    </script>
</body>
</html>
